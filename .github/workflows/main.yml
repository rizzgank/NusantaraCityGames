name: Build City Building Nusantara v4.0 Skylines HD IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools & Dependencies
        run: |
          brew install xcodegen
          python3 -m pip install --upgrade pip
          pip install pillow numpy

      - name: Generate HD PBR Textures, Alpha Foliage, Audio & AppIcon
        run: |
          rm -rf Resources GameAssets Assets.xcassets
          python3 Scripts/generate_assets.py
          du -sh GameAssets Assets.xcassets

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          set -o pipefail
          xcodebuild -project CityBuildingNusantara.xcodeproj \
            -scheme CityBuildingNusantara \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          rm -rf Payload CityBuildingNusantara.ipa
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CityBuildingNusantara.app Payload/
          zip -qr CityBuildingNusantara.ipa Payload
          ls -lh CityBuildingNusantara.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityBuildingNusantara-v4-SkylinesHD-IPA
          path: CityBuildingNusantara.ipa

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "City Building : Nusantara Project v4.0.${{ github.run_number }} (Skylines HD Edition)"
          files: CityBuildingNusantara.ipa
