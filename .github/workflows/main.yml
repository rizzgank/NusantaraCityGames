name: Build City Building Nusantara IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Generate Assets & Compile iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Asset Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install XcodeGen & Image/Audio Libraries
        run: |
          brew install xcodegen
          python3 -m pip install --upgrade pip
          pip install pillow numpy

      - name: Generate AppIcon, 3D Models, HD Textures, Maps & Audio (100MB+)
        run: |
          python3 Scripts/generate_assets.py
          du -sh Resources Assets.xcassets

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate

      - name: Build Release App for iPhone
        run: |
          xcodebuild \
            -project CityBuildingNusantara.xcodeproj \
            -scheme CityBuildingNusantara \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Clean, Sign & Package CityBuildingNusantara.ipa
        run: |
          rm -rf Payload CityBuildingNusantara.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CityBuildingNusantara.app Payload/
          printf "APPL????" > Payload/CityBuildingNusantara.app/PkgInfo
          xattr -cr Payload/CityBuildingNusantara.app
          /usr/bin/codesign --force --deep --sign - --timestamp=none Payload/CityBuildingNusantara.app
          /usr/bin/codesign --verify --deep --strict --verbose=2 Payload/CityBuildingNusantara.app
          zip -r -X CityBuildingNusantara.ipa Payload
          ls -lh CityBuildingNusantara.ipa

      - name: Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CityBuildingNusantara-IPA
          path: CityBuildingNusantara.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "City Building : Nusantara Project v1.0.${{ github.run_number }}"
          body: |
            Build otomatis oleh Rizzi Games (RG) via GitHub Actions.
            Siap di-sign & install menggunakan ESign, TrollStore, atau Filza.
          files: CityBuildingNusantara.ipa
