name: Build City Building Nusantara IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare GameAssets Bundle
        run: |
          rm -rf Resources GameAssets Assets.xcassets
          mkdir -p GameAssets
          echo '{"studio":"Rizzi Games","project":"City Building Nusantara","version":"1.0"}' > GameAssets/manifest.json

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -project CityBuildingNusantara.xcodeproj \
            -scheme CityBuildingNusantara \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          rm -rf Payload CityBuildingNusantara.ipa
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CityBuildingNusantara.app Payload/
          zip -qr CityBuildingNusantara.ipa Payload
          ls -lh CityBuildingNusantara.ipa

      - name: Upload CityBuildingNusantara.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityBuildingNusantara-IPA
          path: CityBuildingNusantara.ipa

      - name: Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "City Building : Nusantara Project v1.0.${{ github.run_number }}"
          files: CityBuildingNusantara.ipa
